# yaml-language-server: $schema=../../schemas/application-config.schema.json
#
# ECOM / DEV shared configuration (DEMO SIZE: runs on a small local cluster).
# The SAME file is deployed to ecom-dev-dr first, then (after approval) to ecom-dev-primary.
# Do not add site-specific keys here (ids, locators, endpoints, certificates): they are
# generated by gemfire-k8s-helm at deploy time.
schemaVersion: 1

application:
  name: ecom            # must equal the folder name
  environment: dev      # must equal the folder name

gemfire:
  cluster:
    memberCount: 2      # data servers per site (2 = minimum that allows 1 redundant copy)
    locatorCount: 1     # locators per site (demo; use 2+ for real redundancy)

  jvm:
    heapPercentOfMemoryLimit: 60   # 60% of the 2Gi limit ~ 1.2Gi heap

  properties:           # allow-listed gemfire.properties only
    log-level: config
    member-timeout: 5000

  cacheServer:
    maxConnections: 200

  diskStore:
    autoCompact: true
    compactionThreshold: 50
    maxOplogSizeMb: 64
    diskUsageWarningPercentage: 80
    diskUsageCriticalPercentage: 95

  regions:
    - name: CUSTOMER
      type: PARTITION_PERSISTENT_OVERFLOW
      redundantCopies: 1
      totalNumBuckets: 31           # fixed at creation; small for a demo
      eviction:                     # moves values to disk under heap pressure; never destroys
        policy: HEAP_LRU
        action: OVERFLOW_TO_DISK
      expiration:                   # TTL deletes entries (unlike eviction)
        ttl:
          timeoutSeconds: 3600
          action: DESTROY
      indexes:
        - name: customerIdIndex
          expression: customerId
          type: FUNCTIONAL

    - name: ORDER
      type: PARTITION_PERSISTENT_OVERFLOW
      redundantCopies: 1
      totalNumBuckets: 31
      eviction:
        policy: HEAP_LRU
        action: OVERFLOW_TO_DISK
      indexes:
        - name: orderCustomerIdIndex
          expression: customerId
          type: FUNCTIONAL

  pdx:
    readSerialized: false
    ignoreUnreadFields: true        # DEV only; prod policy requires false
    persistent: true
    autoSerializableClasses:
      - 'com\.example\.ecom\.model\..*'

  resourceManager:
    evictionHeapPercentage: 70
    criticalHeapPercentage: 90

resources:
  member:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "1",  memory: 2Gi }
  locator:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

storage:
  size: 5Gi              # per server
  locatorSize: 1Gi
  storageClassName: gemfire-storage

wan:
  enabled: true
  mode: ACTIVE_ACTIVE
  sender:
    parallel: true
    persistent: true
    dispatcherThreads: 2
    batchSize: 100
    batchTimeIntervalMs: 1000
    maximumQueueMemoryMb: 50
    orderPolicy: KEY
    conflationEnabled: false
    diskSynchronous: true
    alertThresholdMs: 0
